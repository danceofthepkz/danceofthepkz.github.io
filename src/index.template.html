<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="author" content="{{name}}">
<link rel="canonical" href="{{canonical}}">

<meta property="og:type" content="profile">
<meta property="og:site_name" content="{{siteTitle}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{url}}assets/og-image.png">
<meta property="og:image:width" content="1600">
<meta property="og:image:height" content="840">
<meta property="og:image:alt" content="A pixel-art dusk landscape with three landmarks on rock pillars.">
<meta name="twitter:card" content="summary_large_image">

<meta name="theme-color" content="#1E1A33" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#D9D3E6" media="(prefers-color-scheme: light)">
<link rel="icon" href="{{base}}assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="{{base}}assets/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="{{base}}assets/apple-touch-icon.png">

<link rel="preload" href="{{base}}fonts/spectral-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{base}}styles.css?v={{version}}">
<script type="module" src="{{base}}main.js?v={{version}}"></script>
</head>
<body>
<div data-root="" data-mode="night">
<a class="skip-link" href="#content">Skip to content</a>
<canvas class="scene" data-scene="" aria-hidden="true"></canvas>
<button type="button" id="theme-toggle" class="theme-toggle" aria-label="Switch to day" title="Switch to day">
<span data-when="day">
<svg width="20" height="20" viewBox="0 0 10 10" aria-hidden="true" shape-rendering="crispEdges"><rect x="3" y="1" width="4" height="1" fill="currentColor"></rect><rect x="2" y="2" width="2" height="1" fill="currentColor"></rect><rect x="1" y="3" width="2" height="4" fill="currentColor"></rect><rect x="2" y="7" width="2" height="1" fill="currentColor"></rect><rect x="3" y="8" width="5" height="1" fill="currentColor"></rect><rect x="7" y="7" width="2" height="1" fill="currentColor"></rect><rect x="5" y="2" width="2" height="1" fill="currentColor"></rect></svg>
</span>
<span data-when="night">
<svg width="20" height="20" viewBox="0 0 10 10" aria-hidden="true" shape-rendering="crispEdges"><rect x="3" y="3" width="4" height="4" fill="currentColor"></rect><rect x="4" y="0" width="2" height="2" fill="currentColor"></rect><rect x="4" y="8" width="2" height="2" fill="currentColor"></rect><rect x="0" y="4" width="2" height="2" fill="currentColor"></rect><rect x="8" y="4" width="2" height="2" fill="currentColor"></rect><rect x="1" y="1" width="1" height="1" fill="currentColor"></rect><rect x="8" y="1" width="1" height="1" fill="currentColor"></rect><rect x="1" y="8" width="1" height="1" fill="currentColor"></rect><rect x="8" y="8" width="1" height="1" fill="currentColor"></rect></svg>
</span>
</button>
<main class="page">

<nav class="nav" aria-label="Primary">
{{nav}}
</nav>

<article class="paper" data-paper="" id="content" tabindex="-1">
<div class="haze" aria-hidden="true"></div>

{{body}}

<footer class="footer">
<span>Last updated {{lastUpdated}}</span>
<span>{{footerNote}}</span>
</footer>
</article>

<div class="spacer" aria-hidden="true"></div>
</main>
</div>
</body>
</html>
